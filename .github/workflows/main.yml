name: Update DART Data and Deploy Dashboard

on:
  workflow_dispatch:
  schedule:
    # 00:00 UTC on the first day of each month = 09:00 KST.
    - cron: "0 0 1 * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/main.yml"
      - "orion_dart_agent/src/**"
      - "orion_dart_agent/config/settings.json"
      - "orion_dart_agent/requirements.txt"
      - "orion_dart_agent/dashboard/index.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "orion-pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: orion_dart_agent/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r orion_dart_agent/requirements.txt

      - name: Validate Python sources
        run: python -m py_compile orion_dart_agent/src/dart_crawler.py orion_dart_agent/src/build_dashboard_data.py

      - name: Collect Orion DART data
        working-directory: orion_dart_agent
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/dart_crawler.py --force

      - name: Build dashboard data
        working-directory: orion_dart_agent
        run: python src/build_dashboard_data.py

      - name: Validate dashboard JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("orion_dart_agent/dashboard/data/financials.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if not payload.get("records"):
              raise SystemExit("Dashboard data is empty; refusing to deploy.")
          print(f"Validated {len(payload['records'])} financial records.")
          PY

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orion_dart_agent/data/processed/financials.csv orion_dart_agent/dashboard/data/financials.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Orion DART dashboard data"
            git push
          else
            echo "No data changes to commit."
          fi

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: orion_dart_agent/dashboard

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
